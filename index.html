<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MEV Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left nav + sticky top bar + dense work surface; cool zinc neutrals, near-black primary, one blue accent */
:root{
  --bg:#FAFAFA; --surface:#FFFFFF; --surface-2:#F4F4F5; --fg:#18181B; --muted:#52525B; --faint:#A1A1AA;
  --accent:#2563EB; --accent-bg:#18181B; --on-accent:#FFFFFF; --accent-soft:#EFF6FF; --line:#E4E4E7; --line-2:#F0F0F2;
  --ok:#15803D; --ok-soft:#F0FDF4; --warn:#B45309; --warn-soft:#FFFBEB; --bad:#B91C1C; --bad-soft:#FEF2F2;
  --info:#1D4ED8; --info-soft:#EFF6FF; --mute-soft:#F4F4F5;
  --thumb-l1:86%; --thumb-l2:72%;
  --shadow:0 1px 2px rgba(24,24,27,.04),0 8px 24px rgba(24,24,27,.08);
  --f-ui:"Geist","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09090B; --surface:#141417; --surface-2:#1C1C20; --fg:#FAFAFA; --muted:#A1A1AA; --faint:#71717A;
  --accent:#60A5FA; --accent-bg:#FAFAFA; --on-accent:#18181B; --accent-soft:#172036; --line:#27272A; --line-2:#1F1F23;
  --ok:#4ADE80; --ok-soft:#10261A; --warn:#FBBF24; --warn-soft:#2B2210; --bad:#F87171; --bad-soft:#2D1515;
  --info:#93C5FD; --info-soft:#172036; --mute-soft:#1F1F23; --thumb-l1:30%; --thumb-l2:20%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#09090B; --surface:#141417; --surface-2:#1C1C20; --fg:#FAFAFA; --muted:#A1A1AA; --faint:#71717A;
  --accent:#60A5FA; --accent-bg:#FAFAFA; --on-accent:#18181B; --accent-soft:#172036; --line:#27272A; --line-2:#1F1F23;
  --ok:#4ADE80; --ok-soft:#10261A; --warn:#FBBF24; --warn-soft:#2B2210; --bad:#F87171; --bad-soft:#2D1515;
  --info:#93C5FD; --info-soft:#172036; --mute-soft:#1F1F23; --thumb-l1:30%; --thumb-l2:20%;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
svg.lucide{width:16px;height:16px;stroke-width:1.8;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* shell */
.sb{position:fixed;top:0;bottom:0;left:0;width:248px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;
  padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:50;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 14px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--accent-bg);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.04em}
.brand b{display:block;font-size:15px;letter-spacing:.02em}
.brand span{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
.nav-g{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);padding:12px 10px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--fg);text-decoration:none;font-size:13.5px;cursor:pointer}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--surface-2);color:var(--fg);font-weight:600}
.nav a.on svg{color:var(--accent)}
.nav a svg{color:var(--muted)}
.nav a .cnt{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;background:var(--bad-soft);color:var(--bad);padding:0 6px;border-radius:9px;font-weight:600}
.sb-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.sb-foot a{display:flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;color:var(--muted)}
.sb-foot a:hover{color:var(--fg)}
.main{margin-left:248px;min-width:0;display:flex;flex-direction:column;min-height:100%}
.demo-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);color:var(--fg);border-bottom:1px solid var(--line);font-size:12.5px;
  padding:7px max(24px,env(safe-area-inset-right,0px)) 7px max(24px,env(safe-area-inset-left,0px))}
.demo-bar b{letter-spacing:.06em;font-size:11px;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 6px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
  padding:10px max(24px,env(safe-area-inset-right,0px)) 10px max(24px,env(safe-area-inset-left,0px))}
.menu-btn{display:none}
.gsearch{position:relative;flex:1;max-width:520px}
.gsearch input{width:100%;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 12px 0 34px;font-size:13.5px}
.gsearch>svg{position:absolute;left:11px;top:10px;color:var(--muted)}
.gsearch kbd{position:absolute;right:9px;top:8px;font:11px var(--f-mono);color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface-2)}
.gres{position:absolute;top:42px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;max-height:380px;overflow:auto}
.gres .gi{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:7px;cursor:pointer}
.gres .gi:hover{background:var(--surface-2)}
.gres .gh{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:6px 8px 2px;font-weight:600}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;position:relative}
.icon-btn:hover{background:var(--surface-2)}
.dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.me{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border:1px solid var(--line);border-radius:20px;background:var(--surface);font-size:12.5px}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.av.sm{width:22px;height:22px;font-size:9.5px}
.pop{position:absolute;right:0;top:44px;width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;z-index:60}
.pop .pi{display:flex;gap:10px;padding:9px 8px;border-radius:8px;font-size:13px;cursor:pointer}
.pop .pi:hover{background:var(--surface-2)}
.view{width:100%;max-width:1480px;padding-block:24px 56px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.scrim{display:none}

/* type + layout */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:22px;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted);font-size:13.5px;max-width:68ch}
.crumb{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:8px}
.crumb a{cursor:pointer;color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--fg)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1fr) 340px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.panel-h h3{margin:0;font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.panel-b{padding:14px 16px}
.panel-b.flush{padding:0}
.sub-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600;margin:0 0 8px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent-bg);border-color:var(--accent-bg);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn .lk{opacity:.75;width:13px;height:13px}
.btn.locked{position:relative}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:2px}
.seg button{border:0;background:transparent;height:28px;padding:0 12px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--muted);transition:background-color .15s,color .15s}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(24,24,27,.1),0 0 0 1px var(--line)}
.inp,.sel{height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px;font-size:13px;min-width:0}
.sel{padding-right:6px}
textarea.inp{height:auto;padding:8px 10px;resize:vertical}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-2);align-items:center}
.filters .inp.search{flex:1 1 220px}
.filters .sel{flex:0 1 auto}
.filters .rng{display:flex;align-items:center;gap:4px}
.filters .rng .inp{width:96px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--mute-soft);color:var(--fg);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:20px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--mute-soft);color:var(--muted)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.tag-test{font:600 10.5px var(--f-mono);letter-spacing:.06em;color:var(--warn);background:var(--warn-soft);border:1px dashed var(--warn);border-radius:4px;padding:1px 6px}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.t td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--surface-2)}
.t td.r,.t th.r{text-align:right}
.t .nw{white-space:nowrap}
.t tr:last-child td{border-bottom:0}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.thumb{width:52px;height:40px;border-radius:6px;display:grid;place-items:center;color:rgba(255,255,255,.9);flex:none;
  background:linear-gradient(140deg,hsl(calc(var(--h) + 60) 12% var(--thumb-l1)),hsl(calc(var(--h) + 80) 16% var(--thumb-l2)))}
.cell2{display:flex;align-items:center;gap:10px;min-width:0}
.cell2 b{font-weight:500;display:block;white-space:nowrap}
.cell2 small{color:var(--muted);font-size:12px;white-space:nowrap}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;min-width:0;cursor:pointer}
.kpi:hover{background:var(--surface-2)}
.kpi .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.2}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.alert .v{color:var(--bad)}
.kgrp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600;margin:18px 0 8px}

/* lists */
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer}
.li.click:hover{background:var(--surface-2)}
.li .main-t{font-size:13px;min-width:0;flex:1}
.li .main-t small{display:block;color:var(--muted);font-size:12px}
.ico-b{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none;background:var(--mute-soft);color:var(--muted)}
.ico-b.bad{background:var(--bad-soft);color:var(--bad)} .ico-b.ok{background:var(--ok-soft);color:var(--ok)} .ico-b.warn{background:var(--warn-soft);color:var(--warn)} .ico-b.acc{background:var(--accent-soft);color:var(--accent)} .ico-b.info{background:var(--info-soft);color:var(--info)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}
.empty svg{width:22px;height:22px;margin-bottom:6px;color:var(--faint)}
.empty b{display:block;color:var(--fg);font-weight:500;margin-bottom:2px}

/* detail */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:var(--line-2)}
.dl>div{background:var(--surface);padding:10px 16px}
.dl dt{font-size:11.5px;color:var(--muted)}
.dl dd{margin:2px 0 0;font-size:13.5px;font-weight:500}
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:120px 120px;gap:6px;padding:12px}
.gallery .ph-img{border-radius:8px;position:relative;display:grid;place-items:center;color:rgba(255,255,255,.9);overflow:hidden;
  background:linear-gradient(140deg,hsl(calc(var(--h) + 60) 12% var(--thumb-l1)),hsl(calc(var(--h) + 80) 16% var(--thumb-l2)))}
.gallery .ph-img:first-child{grid-row:span 2}
.gallery .ph-img svg{width:26px;height:26px}
.gallery .src{position:absolute;left:8px;bottom:8px;font-size:11px;background:rgba(0,0,0,.45);color:#fff;padding:1px 7px;border-radius:10px}
.gallery .main-b{position:absolute;left:8px;top:8px;font-size:11px;background:rgba(255,255,255,.9);color:#202421;padding:1px 7px;border-radius:10px;font-weight:600}
.price-box{padding:16px}
.price-box .big{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 10px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--fg);font-weight:600}
.tabs button .c{font-size:11px;color:var(--faint);margin-left:4px}
.tl{position:relative;padding:4px 16px 8px}
.tl-i{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:8px 0;position:relative}
.tl-i::before{content:"";position:absolute;left:13.5px;top:38px;bottom:-8px;width:1px;background:var(--line)}
.tl-i:last-child::before{display:none}
.tl-i .tt{font-size:13px}
.tl-i .tt small{display:block;color:var(--muted);font-size:12px}
.note{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;background:var(--surface-2)}
.callout{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:11px 14px;font-size:13px;line-height:1.45}
.callout.info{background:var(--info-soft);color:var(--fg)} .callout.info>svg{color:var(--info)}
.callout.warn{background:var(--warn-soft)} .callout.warn>svg{color:var(--warn)}
.callout.acc{background:var(--accent-soft)} .callout.acc>svg{color:var(--accent)}
.callout>svg{margin-top:2px}

/* score */
.score{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;flex:none;
  background:conic-gradient(var(--sc) calc(var(--v)*1%),var(--line) 0);position:relative}
.score::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.score span{position:relative}
.why{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.why .w{font-size:11.5px;padding:1px 8px;border-radius:12px;display:inline-flex;gap:4px;align-items:center}
.why .w svg{width:12px;height:12px}
.w.ok{background:var(--ok-soft);color:var(--ok)} .w.part{background:var(--warn-soft);color:var(--warn)} .w.bad{background:var(--bad-soft);color:var(--bad)}
.match{display:flex;gap:14px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.match.dim{opacity:.62}
.wt{display:grid;grid-template-columns:90px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:12.5px;padding:5px 0}
.wt input{width:100%;accent-color:var(--accent-bg)}

/* chess */
.chess{display:flex;flex-direction:column;gap:4px;min-width:max-content}
.chess .fl{display:grid;gap:4px;align-items:stretch}
.chess .fn{font:500 11px var(--f-mono);color:var(--muted);display:grid;place-items:center}
.ap{border-radius:6px;padding:5px 7px;font-size:11px;line-height:1.25;cursor:pointer;border:1px solid transparent;min-width:72px;text-align:left;background:none}
.ap b{font:600 11.5px var(--f-mono);display:block}
.ap.s-sale{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.ap.s-res{background:var(--warn-soft);color:var(--warn)}
.ap.s-sold{background:var(--mute-soft);color:var(--faint)}
.ap.s-off{background:repeating-linear-gradient(135deg,var(--mute-soft) 0 5px,transparent 5px 10px);color:var(--muted);border-color:var(--line)}
.ap.s-chk{background:var(--bad-soft);color:var(--bad);border:1px dashed var(--bad)}
.ap.sel{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}

/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:12.5px}
.bar .track{height:10px;background:var(--line-2);border-radius:5px;overflow:hidden;display:flex}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.stackbar .track{border-radius:5px}
.stackbar .seg1{background:var(--ok)} .stackbar .seg2{background:var(--warn)} .stackbar .seg3{background:var(--faint)} .stackbar .seg4{background:var(--bad)}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcol h4{margin:0 2px 2px;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.kcard .pr{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}

/* matrix */
.mx td,.mx th{text-align:center}
.mx td:first-child,.mx th:first-child{text-align:left}
.ck{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;border:1px solid var(--line)}
.ck.on{background:var(--accent-bg);border-color:var(--accent-bg);color:var(--on-accent)}
.ck svg{width:12px;height:12px;stroke-width:3}

/* tree */
.tree{font-size:13px}
.tree .n{display:flex;align-items:center;gap:8px;padding:5px 0}
.tree .k{margin-left:22px;border-left:1px solid var(--line);padding-left:12px}

/* modal + toast */
.modal-wrap{position:fixed;inset:0;background:rgba(17,20,18,.42);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(760px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;border:1px solid var(--line)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:15px;font-weight:600}
.modal-b{padding:16px 18px;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12px;color:var(--muted);font-weight:500}
.fld .hint{font-size:11.5px;color:var(--faint)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:12.5px;background:var(--surface-2)}
.cbx{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);padding:5px 10px;border-radius:8px;cursor:pointer;background:var(--surface)}
.cbx input{accent-color:var(--accent-bg)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(460px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);border-radius:10px;padding:11px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow);animation:tin .18s ease-out;width:100%}
.toast b{display:block}
.toast span{opacity:.75}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.sb{transition:none!important}}

/* login */
.login{min-height:calc(100vh - 160px);display:grid;place-items:center}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:14px}
.login-card .inp{height:40px}

@media (max-width:1180px){.g-main{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:960px){
  .sb{transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow)}
  .sb.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(17,20,18,.35);z-index:45}
  .main{margin-left:0}
  .menu-btn{display:inline-grid}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top,.demo-bar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .me span{display:none}.me{padding-right:3px}
  .gsearch kbd{display:none}
}
@media (max-width:560px){
  .kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .gallery{grid-template-columns:1fr 1fr;grid-template-rows:140px 90px 90px}
  .gallery .ph-img:first-child{grid-column:span 2;grid-row:auto}
  .bar{grid-template-columns:100px minmax(0,1fr) 36px}
  .top-r .btn span{display:none}
  .ph h1{font-size:19px}
}
</style>
</head>
<body>
<aside class="sb" id="sb">
  <div class="brand"><div class="brand-mark">MEV</div><div><b>MEV</b><span>Real Əmlak · daxili platforma</span></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="sb-foot">
    <a data-go="giris"><i data-lucide="log-in"></i>Giriş ekranına bax</a>

  </div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="main">
  <div class="demo-bar"><b>DEMO</b><span>Bütün məlumatlar nümunədir. Baxış və filtrlər işləyir, yazma əməliyyatları kilidlidir.</span></div>
  <header class="top">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menyu"><i data-lucide="menu"></i></button>
    <div class="gsearch">
      <i data-lucide="search"></i>
      <input id="gq" type="search" placeholder="Elan nömrəsi, ünvan, müştəri adı və ya telefon" autocomplete="off" aria-label="Qlobal axtarış">
      <kbd>/</kbd>
      <div class="gres" id="gres" hidden></div>
    </div>
    <div class="top-r">
      <div style="position:relative">
        <button class="btn pri" id="qaBtn"><i data-lucide="plus"></i><span>Əlavə et</span></button>
        <div class="pop" id="qaPop" hidden style="width:220px"></div>
      </div>
      <div style="position:relative">
        <button class="icon-btn" id="bellBtn" aria-label="Bildirişlər"><i data-lucide="bell"></i><span class="dot"></span></button>
        <div class="pop" id="bellPop" hidden></div>
      </div>
      <div class="me"><span class="av">OB</span><span>Orxan B. · Administrator</span></div>
    </div>
  </header>
  <main class="view" id="view"></main>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20261022);
const pick=a=>a[Math.floor(R()*a.length)];
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const wpick=p=>{let t=p.reduce((s,x)=>s+x[1],0),x=R()*t;for(const q of p){if((x-=q[1])<0)return q[0]}return p[0][0]};
const TODAY=new Date();TODAY.setHours(10,0,0,0);
const day=(n,h)=>{const d=new Date(TODAY.getTime()+n*864e5);if(h!=null)d.setHours(h,ri(0,5)*10,0,0);return d};
const MON=['yan','fev','mar','apr','may','iyn','iyl','avq','sen','okt','noy','dek'];
const fD=d=>d?`${d.getDate()} ${MON[d.getMonth()]}${d.getFullYear()!==TODAY.getFullYear()?' '+d.getFullYear():''}`:'–';
const fT=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
const fDT=d=>fD(d)+', '+fT(d);
const dd=d=>Math.round((new Date(d).setHours(0,0,0,0)-new Date(TODAY).setHours(0,0,0,0))/864e5);
const rel=d=>{const n=dd(d);return n===0?'bu gün':n===-1?'dünən':n===1?'sabah':n<0?`${-n} gün əvvəl`:`${n} gün sonra`};
const num=n=>n==null?'–':Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const azn=n=>n==null?'–':num(n)+' AZN';
const ic=(n,c='')=>`<i data-lucide="${n}"${c?` class="${c}"`:''}></i>`;
const initials=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('');
const icons=()=>{try{window.lucide&&lucide.createIcons()}catch(e){}};
const L=(label,txt,cls='',icon='')=>`<button class="btn ${cls} locked" data-lock="${esc(txt)}">${icon?ic(icon):''}${esc(label)}<i data-lucide="lock" class="lk"></i></button>`;

/* ---------- reference data ---------- */
const LOC={
  'Nəsimi':['28 May','Nizami m.','Memar Əcəmi'],'Yasamal':['Yeni Yasamal','İnşaatçılar','Elmlər Akademiyası'],
  'Nərimanov':['Gənclik','Nərimanov m.','Təbriz küç.'],'Xətai':['Ağ şəhər','Həzi Aslanov','Əhmədli'],
  'Səbail':['Bayıl','Badamdar','Sahil'],'Nizami':['Qara Qarayev','8-ci km','Neftçilər'],
  'Binəqədi':['Azadlıq pr.','Dərnəgül','9-cu mkr.'],'Xəzər':['Mərdəkan','Şüvəlan','Buzovna'],
  'Sabunçu':['Bakıxanov','Ramana'],'Suraxanı':['Qaraçuxur','Hövsan']
};
const DISTRICTS=Object.keys(LOC);
const STREETS=['Ş. Mehdiyev','H. Cavid','Ə. Rəcəbli','Z. Xəlil','A. Məhərrəmov','S. Vurğun','B. Bağırova','N. Rəfibəyli','M. Hadi','İ. Qutqaşınlı'];
const TYPES=['İkinci əl mənzil','Yeni tikili mənzil','Həyət evi / villa','Torpaq sahəsi','Kommersiya obyekti','Digər'];
const TICON={'İkinci əl mənzil':'building','Yeni tikili mənzil':'building-2','Həyət evi / villa':'house','Torpaq sahəsi':'map','Kommersiya obyekti':'store','Digər':'box'};
const PSTAT=['Qaralama','Aktiv','Rezerv edilib','Satılıb','Kirayəyə verilib','Müvəqqəti əlçatan deyil','Arxivləşdirilib'];
const PCLS={'Qaralama':'p-mute','Aktiv':'p-ok','Rezerv edilib':'p-warn','Satılıb':'p-info','Kirayəyə verilib':'p-info','Müvəqqəti əlçatan deyil':'p-bad','Arxivləşdirilib':'p-mute'};
const SOURCES=['Əməkdaş','Mülk sahibi','Tövsiyə','Tikinti API (test)','Bitrix idxalı'];
const REPAIR=['Əla təmirli','Orta təmirli','Təmirsiz','Ağ karkas','Qara karkas'];
const pill=s=>`<span class="pill ${PCLS[s]||'p-mute'}">${esc(s)}</span>`;

const USERS=[
  {id:1,name:'Orxan Babayev',role:'Administrator',email:'o.babayev@sirket.az',active:true,last:day(0,9)},
  {id:2,name:'Günay Əliyeva',role:'Rəhbərlik',email:'g.aliyeva@sirket.az',active:true,last:day(0,8)},
  {id:3,name:'Aysel Məmmədova',role:'Əmlak agenti',email:'a.mammadova@sirket.az',active:true,last:day(0,9)},
  {id:4,name:'Rəşad Quliyev',role:'Əmlak agenti',email:'r.quliyev@sirket.az',active:true,last:day(-1,18)},
  {id:5,name:'Elvin Səfərov',role:'Əmlak agenti',email:'e.seferov@sirket.az',active:true,last:day(0,10)},
  {id:6,name:'Nigar Həsənova',role:'Müştəri xidmətləri',email:'n.hesenova@sirket.az',active:true,last:day(0,9)},
  {id:7,name:'Lalə Kərimova',role:'Yalnız oxuma',email:'l.kerimova@sirket.az',active:true,last:day(-3,11)},
  {id:8,name:'Tərlan Nəbiyev',role:'Əmlak agenti',email:'t.nebiyev@sirket.az',active:false,last:day(-46,16)}
];
const U=id=>USERS.find(u=>u.id===id)||{name:'–'};
const AGENTS=[3,4,5];
const short=id=>{const n=U(id).name.split(' ');return n[0]+' '+(n[1]||'')[0]+'.'};

/* developers / projects / apartments */
const DEVS=[
  {id:'A',name:'Tikinti şirkəti A',contact:'Satış şöbəsi',phone:'+994 12 000 00 01',integ:'test',label:'Test adapteri',
   note:'Real API sənədi alınana qədər məlumatlar test adapterindən gəlir. İnterfeysdə hər yerdə TEST kimi işarələnir.'},
  {id:'B',name:'Tikinti şirkəti B',contact:'Marketinq şöbəsi',phone:'+994 12 000 00 02',integ:'wait',label:'API sənədi gözlənilir',
   note:'Şirkətlə əlaqə qurulub, API sənədi və açar gözlənilir. Qoşulana qədər stok göstərilmir.'},
  {id:'C',name:'Tikinti şirkəti C',contact:'Direktor müavini',phone:'+994 12 000 00 03',integ:'manual',label:'Əl ilə idarə olunur',
   note:'API yoxdur. Stok agentlik əməkdaşı tərəfindən əl ilə yenilənir.'}
];
const PROJECTS=[
  {id:'P1',dev:'A',name:'Kompleks A1',district:'Yasamal',area:'Yeni Yasamal',status:'Tikinti gedir · karkas tamamlanıb',ppm:2150,desc:'16 və 12 mərtəbəli iki blok, yeraltı dayanacaq, həyətdə uşaq meydançası.',
   b:[{id:'P1B1',name:'Blok 1',floors:16,units:6},{id:'P1B2',name:'Blok 2',floors:12,units:4}]},
  {id:'P2',dev:'A',name:'Kompleks A2',district:'Xətai',area:'Ağ şəhər',status:'Təhvil verilib',ppm:2650,desc:'Bulvara yaxın, kommersiya birinci mərtəbə, qapalı ərazi.',
   b:[{id:'P2B1',name:'Blok A',floors:14,units:5}]},
  {id:'P3',dev:'B',name:'Kompleks B1',district:'Nərimanov',area:'Gənclik',status:'Satış başlayıb',ppm:2400,desc:'Metroya 5 dəqiqə, 18 mərtəbəli tək blok.',
   b:[{id:'P3B1',name:'Blok 1',floors:18,units:4}]},
  {id:'P4',dev:'C',name:'Kompleks C1',district:'Xəzər',area:'Mərdəkan',status:'Tikinti gedir',ppm:1450,desc:'Bağ zonasında az mərtəbəli kompleks, dənizə 1,2 km.',
   b:[{id:'P4B1',name:'Blok 1',floors:9,units:4}]}
];
const APTS=[];
const ASTAT={sale:'Satışda',res:'Rezerv',sold:'Satılıb',off:'Satışdan çıxarılıb',chk:'Yoxlama tələb edir'};
PROJECTS.forEach(p=>{ if(p.dev==='B')return; p.b.forEach(b=>{
  const pattern=[1,2,3,2,3,4,2,3];
  for(let f=1;f<=b.floors;f++)for(let u=1;u<=b.units;u++){
    const rooms=pattern[(u-1)%pattern.length]; const m2=+({1:ri(46,56),2:ri(68,84),3:ri(96,122),4:ri(128,152)}[rooms]+R()).toFixed(1);
    const ppm=Math.round((p.ppm+(f-1)*12+(R()-.5)*80)/10)*10;
    let st=wpick([['sale',50],['res',7],['sold',f<5?55:30],['off',3]]);
    if(p.dev==='A'&&R()<.025)st='chk';
    APTS.push({id:`${b.id}-${f}-${u}`,pid:p.id,bid:b.id,dev:p.dev,ext:p.dev==='A'?`A-${p.id.slice(1)}${b.id.slice(-1)}-${String(f).padStart(2,'0')}${u}`:'–',
      no:(f-1)*b.units+u,floor:f,rooms,m2,ppm,price:Math.round(ppm*m2/100)*100,st,upd:p.dev==='A'?day(0,6):day(-ri(3,20),12),src:p.dev==='A'?'Test adapteri':'Əl ilə'});
  }
})});

/* properties */
const PROPS=[];
for(let i=0;i<54;i++){
  const type=wpick([['İkinci əl mənzil',48],['Yeni tikili mənzil',18],['Həyət evi / villa',12],['Torpaq sahəsi',8],['Kommersiya obyekti',10],['Digər',2]]);
  let district=pick(DISTRICTS); let proj=null;
  if(type==='Yeni tikili mənzil'){proj=pick(PROJECTS.filter(p=>p.dev!=='B'));district=proj.district}
  if(type==='Həyət evi / villa'||type==='Torpaq sahəsi')district=pick(['Xəzər','Sabunçu','Suraxanı','Binəqədi','Xəzər']);
  const area=proj?proj.area:pick(LOC[district]);
  const deal=type==='Torpaq sahəsi'?'Satış':wpick([['Satış',62],['Kirayə',28],['Satış və kirayə',10]]);
  const isApt=type.includes('mənzil');
  const rooms=isApt?wpick([[1,12],[2,34],[3,32],[4,16],[5,6]]):type==='Həyət evi / villa'?ri(3,7):null;
  const m2=isApt?rooms*ri(28,38)+ri(12,22):type==='Həyət evi / villa'?ri(120,420):type==='Torpaq sahəsi'?ri(3,24):type==='Kommersiya obyekti'?ri(40,320):ri(20,80);
  const floors=isApt?(type==='Yeni tikili mənzil'?ri(12,18):ri(5,16)):type==='Həyət evi / villa'?ri(1,3):type==='Kommersiya obyekti'?ri(1,12):null;
  const floor=isApt||type==='Kommersiya obyekti'?ri(1,floors):null;
  const ppm=type==='Torpaq sahəsi'?ri(8,40)*1000:type==='Kommersiya obyekti'?ri(2000,4200):type==='Həyət evi / villa'?ri(1400,3000):ri(1650,3300);
  const price=deal==='Kirayə'?null:Math.round(m2*ppm/1000)*1000;
  const rent=deal==='Satış'?null:isApt?Math.round((rooms*ri(240,420)+ri(150,350))/50)*50:type==='Kommersiya obyekti'?Math.round(m2*ri(12,26)/50)*50:Math.round(ri(1200,4000)/100)*100;
  let status=wpick([['Aktiv',62],['Rezerv edilib',7],['Satılıb',8],['Qaralama',7],['Müvəqqəti əlçatan deyil',6],['Arxivləşdirilib',8]]);
  if(status==='Satılıb'&&deal==='Kirayə')status='Kirayəyə verilib';
  const created=day(-ri(1,210),ri(9,18));
  const upd=day(-Math.min(ri(0,40),-dd(created)),ri(9,18));
  const ph=[];
  if(price&&R()<.45){let p0=price;for(let k=0,n=ri(1,2);k<n;k++){p0=Math.round(p0*(1+ri(3,8)/100)/1000)*1000;ph.unshift({v:p0,d:day(dd(created)+ri(0,10),11)})}}
  if(price)ph.push({v:price,d:ph.length?day(-ri(1,30),12):created});
  const sh=[{s:'Qaralama',d:created,u:pick(AGENTS)}];
  if(status!=='Qaralama'){sh.push({s:'Aktiv',d:day(dd(created)+ri(0,2),12),u:pick(AGENTS)});if(status!=='Aktiv')sh.push({s:status,d:day(-ri(0,25),15),u:status==='Satılıb'?2:pick(AGENTS)})}
  const title=isApt?`${rooms} otaqlı ${type==='Yeni tikili mənzil'?'yeni tikili':'mənzil'}, ${area}`:type==='Həyət evi / villa'?`${rooms} otaqlı həyət evi, ${area}`:type==='Torpaq sahəsi'?`${m2} sot torpaq, ${area}`:type==='Kommersiya obyekti'?`${m2} m² kommersiya obyekti, ${area}`:`Qaraj / anbar, ${area}`;
  const src=type==='Yeni tikili mənzil'&&proj&&proj.dev==='A'?'Tikinti API (test)':wpick([['Əməkdaş',40],['Mülk sahibi',30],['Tövsiyə',12],['Bitrix idxalı',18]]);
  PROPS.push({id:i+1,code:`MEV-${1041+i}`,type,deal,district,area,addr:`${pick(STREETS)} küç., ${ri(3,140)}`,rooms,m2,floor,floors,
    repair:isApt||type==='Həyət evi / villa'?(type==='Yeni tikili mənzil'?pick(['Ağ karkas','Qara karkas','Əla təmirli']):pick(REPAIR.slice(0,3))):null,

const W0={budget:35,loc:25,rooms:20,area:15,other:5};
function scoreMatch(p,r,w){
  const why=[];
  const dealOk=p.deal===r.deal||p.deal==='Satış və kirayə';
  if(!dealOk)return{score:0,hard:true,bad:true,why:[{t:'bad',l:'Əməliyyat növü fərqlidir'}]};
  if(r.type!=='İstənilən'&&r.type!==p.type)return{score:0,hard:true,bad:true,why:[{t:'bad',l:'Əmlak növü fərqlidir'}]};
  const price=r.deal==='Kirayə'?p.rent:p.price; let got=0,tot=0,bad=false;
  tot+=w.budget;
  if(price>=r.bmin&&price<=r.bmax){got+=w.budget;why.push({t:'ok',l:'Büdcəyə uyğundur'})}
  else if(price<r.bmin){got+=w.budget*.75;why.push({t:'part',l:'Büdcədən aşağıdır'})}
  else if(price<=r.bmax*1.1){got+=w.budget*.45;why.push({t:'part',l:`Büdcədən ${Math.round((price/r.bmax-1)*100)}% yuxarı`})}
  else{bad=true;why.push({t:'bad',l:`Büdcədən ${Math.round((price/r.bmax-1)*100)}% yuxarı`})}
  tot+=w.loc;
  if(r.districts.includes(p.district)){got+=w.loc;why.push({t:'ok',l:'İstənilən rayondadır'})}else{bad=true;why.push({t:'bad',l:`${p.district} istənilən rayonlardan deyil`})}
  if(p.rooms!=null&&r.rooms.length){tot+=w.rooms;
    if(r.rooms.includes(p.rooms)){got+=w.rooms;why.push({t:'ok',l:'Otaq sayı uyğundur'})}
    else if(r.rooms.some(x=>Math.abs(x-p.rooms)===1)){got+=w.rooms*.4;why.push({t:'part',l:`${p.rooms} otaq (istənilən ${r.rooms.join('-')})`})}
    else{bad=true;why.push({t:'bad',l:`${p.rooms} otaq, uyğun deyil`})}}
  if(r.amin||r.amax){tot+=w.area;
    if(p.m2>=r.amin&&p.m2<=r.amax){got+=w.area;why.push({t:'ok',l:'Sahə tələbinə uyğundur'})}
    else if(p.m2>=r.amin*.9&&p.m2<=r.amax*1.1){got+=w.area*.5;why.push({t:'part',l:'Sahə həddə yaxındır'})}
    else why.push({t:'part',l:`Sahə ${p.m2} m²`})}
  if(r.repair||r.floor){tot+=w.other;let o=0,n=0;
    if(r.repair){n++;if(p.repair===r.repair){o++;why.push({t:'ok',l:'Təmir tələbinə uyğundur'})}else why.push({t:'part',l:`Təmir: ${p.repair||'göstərilməyib'}`})}
    if(r.floor&&p.floor!=null){n++;const okF=r.floor.startsWith('Birinci')?(p.floor>1&&p.floor<p.floors):p.floor>=5;if(okF){o++;why.push({t:'ok',l:'Mərtəbə tələbinə uyğundur'})}else why.push({t:'part',l:`Mərtəbə ${p.floor}/${p.floors}`})}
    got+=n?w.other*o/n:w.other}
  return{score:tot?Math.round(got/tot*100):0,bad,why};
}

/* properties list */
function filteredProps(){const f=S.pf,q=f.q.trim().toLowerCase();
  return PROPS.filter(p=>(!q||(p.code+' '+p.title+' '+p.addr+' '+p.district+' '+p.area).toLowerCase().includes(q))&&(!f.type||p.type===f.type)&&(!f.deal||p.deal===f.deal||p.deal==='Satış və kirayə')
    &&(!f.status||p.status===f.status)&&(!f.district||p.district===f.district)&&(!f.rooms||(f.rooms==='5'?p.rooms>=5:p.rooms==+f.rooms))&&(!f.agent||p.agent==+f.agent)&&(!f.src||p.src===f.src)&&(!f.proj||p.proj===f.proj)
    &&(!f.pmin||(p.price??p.rent)>=+f.pmin)&&(!f.pmax||(p.price??p.rent)<=+f.pmax)&&(!f.amin||p.m2>=+f.amin)&&(!f.amax||p.m2<=+f.amax)&&(f.status==='Arxivləşdirilib'||p.status!=='Arxivləşdirilib'||f.status))
    .sort((a,b)=>b.upd-a.upd)}
const opt=(v,l,cur)=>`<option value="${esc(v)}"${String(cur)===String(v)?' selected':''}>${esc(l)}</option>`;
const sel=(key,label,vals,cur,scope='pf')=>`<select class="sel" data-f="${scope}.${key}" aria-label="${label}">${opt('',label,cur)}${vals.map(v=>Array.isArray(v)?opt(v[0],v[1],cur):opt(v,v,cur)).join('')}</select>`;

/* property detail */
function sparkline(ph){if(ph.length<2)return '';const vs=ph.map(x=>x.v),mn=Math.min(...vs),mx=Math.max(...vs),w=220,h=44;
  const pts=vs.map((v,i)=>[8+i*(w-16)/(vs.length-1),mx===mn?h/2:6+(mx-v)/(mx-mn)*(h-12)]);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Qiymət dinamikası"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4:3}" fill="${i===pts.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.5"/>`).join('')}</svg>`}
function planSVG(rooms){const r=Math.max(1,Math.min(rooms||2,5));const W=320,H=190;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Mənzil planı sxemi" style="max-height:200px"><rect x="6" y="6" width="${W-12}" height="${H-12}" fill="var(--surface-2)" stroke="var(--fg)" stroke-width="3"/>`;
  const cw=(W-12)/(r+1);for(let i=1;i<=r;i++){s+=`<line x1="${6+cw*i}" y1="6" x2="${6+cw*i}" y2="${H*0.58}" stroke="var(--fg)" stroke-width="1.5"/><text x="${6+cw*(i-0.5)}" y="${H*0.32}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="Geist,sans-serif">${i===1?'Qonaq':'Otaq '+i}</text>`}
  s+=`<text x="${6+cw*(r+0.5)}" y="${H*0.32}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="Geist,sans-serif">Mətbəx</text><line x1="6" y1="${H*0.58}" x2="${W-6}" y2="${H*0.58}" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="${W*0.18} 26"/>
  <text x="${W/2}" y="${H*0.8}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="Geist,sans-serif">Dəhliz · Hamam · Balkon</text></svg>`;return s}
V.emlak=()=>{const p=P(S.param);if(!p)return empty('circle-help','Əmlak tapılmadı','');const proj=p.proj&&PROJECTS.find(x=>x.id===p.proj);

  return `<div class="crumb"><a data-go="emlaklar">Əmlaklar</a>${ic('chevron-right')}<span class="mono">${p.code}</span></div>`+
   ph(`${esc(p.title)}`,`<span class="row">${pill(p.status)}<span class="mono">${p.code}</span><span>·</span><span>${p.district}, ${p.area}</span></span>`,
     `${L('Redaktə et','Əmlakın redaktəsi tam versiyada aktiv olacaq. Hər dəyişiklik audit jurnalına yazılacaq.','', 'pencil')}${L('Statusu dəyiş','Status dəyişikliyi tam versiyada aktiv olacaq. "Satılıb" statusu rəhbərlik təsdiqi tələb edir.','', 'refresh-cw')}${L('Arxivləşdir','Arxivləşdirmə tam versiyada aktiv olacaq. Məlumat silinmir, arxivdən bərpa oluna bilir.','', 'archive')}`)+
   `<div class="grid g-main"><div class="stack">

function matchRow(m,mode){const sc=m.score>=80?'var(--ok)':m.score>=60?'var(--warn)':'var(--bad)';
  const head=mode==='c'?`<a class="click" data-go="musteri" data-id="${m.c.id}" style="font-weight:500;cursor:pointer;text-decoration:none;color:var(--fg)">${esc(m.c.name)}</a> <span class="muted" style="font-size:12px">· ${m.r.deal==='Satış'?'alır':'kirayə axtarır'}, ${m.r.districts.join(', ')} · ${azn(m.r.bmin)} – ${azn(m.r.bmax)}</span>`
    :`<a data-go="emlak" data-id="${m.p.id}" style="font-weight:500;cursor:pointer;text-decoration:none;color:var(--fg)">${esc(m.p.title)}</a> <span class="muted" style="font-size:12px">· <span class="mono">${m.p.code}</span> · ${areaTxt(m.p)} · ${m.r_deal==='Kirayə'?azn(m.p.rent)+' /ay':azn(m.p.price??m.p.rent)}</span>`;
  const off=mode==='p'&&S.mreq?OFFERS.find(o=>o.pid===m.p.id&&o.rid===S.mreq):mode==='c'?OFFERS.find(o=>o.rid===m.r.id&&o.pid===S.param):null;
  return `<div class="match ${m.bad?'dim':''}"><div class="score" style="--v:${m.score};--sc:${sc}"><span>${m.score}</span></div><div style="flex:1;min-width:0">${head}
    <div class="why">${m.why.map(w=>`<span class="w ${w.t}">${ic(w.t==='ok'?'check':w.t==='part'?'minus':'x')}${esc(w.l)}</span>`).join('')}</div></div>
    <div class="row" style="flex:none">${off?`<span class="pill ${OCLS[off.status]}">${off.status}</span>`:m.bad?'<span class="pill p-bad">Uyğunsuz</span>':`<span class="pill p-info">Yeni uyğunluq</span>`}${m.bad?'':L('Təklif et','Təklifin qeydə alınması tam versiyada aktiv olacaq. Müştəriyə avtomatik mesaj göndərilmir, əlaqəni əməkdaş özü saxlayır.','sm')}</div></div>`}
function offerTable(list,mode){return `<div class="tw"><table class="t"><thead><tr><th>${mode==='c'?'Müştəri':'Əmlak'}</th><th class="r">Bal</th><th>Status</th><th>Səbəb / qeyd</th><th>Məsul</th><th>Tarix</th></tr></thead><tbody>
  ${list.map(o=>{const p=P(o.pid),c=C(o.cid);return `<tr class="click" data-go="${mode==='c'?'musteri':'emlak'}" data-id="${mode==='c'?c.id:p.id}"><td>${mode==='c'?esc(c.name):`<div class="cell2">${thumb(p)}<div><b>${esc(p.title)}</b><small class="mono">${p.code}</small></div></div>`}</td><td class="r num">${o.score}</td><td><span class="pill ${OCLS[o.status]}">${o.status}</span></td><td class="muted">${esc(o.reason||'–')}</td><td class="nw">${short(o.agent)}</td><td class="nw muted">${fD(o.d)}</td></tr>`}).join('')}</tbody></table></div>`}

/* customers */
function filteredCust(){const f=S.cf,q=f.q.trim().toLowerCase().replace(/\s/g,'');
  return CUST.filter(c=>{const rq=REQS.filter(r=>r.cid===c.id);
    return (!q||(c.name+c.phone+c.code+c.email).toLowerCase().replace(/\s/g,'').includes(q))&&(!f.cat||c.cats.includes(f.cat))&&(!f.district||rq.some(r=>r.districts.includes(f.district)))
      &&(!f.bmax||rq.some(r=>r.bmax<=+f.bmax))&&(!f.agent||c.agent==+f.agent)&&(!f.status||c.status===f.status)}).sort((a,b)=>b.last-a.last)}

   `${L('İxrac','Müştəri məlumatlarının ixracı xüsusi icazə ilə məhdudlaşdırılacaq və jurnala yazılacaq.','', 'download')}<button class="btn pri" data-form="cust">${ic('user-plus')}Yeni müştəri</button>`)+

    ${sel('agent','Məsul',[...AGENTS,6].map(a=>[a,U(a).name]),f.agent,'cf')}${sel('status','Vəziyyət',CSTAT,f.status,'cf')}

function reqSummary(r){return `${r.deal==='Satış'?'Alır':'Kirayə'}: ${r.rooms.join('-')} otaq, ${r.districts.join(', ')}`}
function renderCustRes(){const list=filteredCust(),per=12,pages=Math.max(1,Math.ceil(list.length/per));S.cpage=Math.min(S.cpage,pages);const rows=list.slice((S.cpage-1)*per,S.cpage*per);

  ${rows.map(c=>{const r=REQS.find(x=>x.cid===c.id&&x.active)||REQS.find(x=>x.cid===c.id);const own=PROPS.find(p=>p.owner===c.id);

    <td class="nw num">${c.phone}</td><td class="muted">${c.email||'–'}</td><td><div class="row" style="gap:4px">${c.cats.map(x=>`<span class="chip acc">${CATL[x]}</span>`).join('')}</div></td>
    <td class="nw">${r?reqSummary(r):own?`Satır: ${esc(own.title)}`:'–'}</td><td class="r num nw">${r?azn(r.bmax)+(r.deal==='Kirayə'?' /ay':''):'–'}</td><td class="nw">${short(c.agent)}</td>
    <td class="nw muted">${rel(c.last)}</td><td class="nw">${c.next?`<span class="${dd(c.next)<0?'pill p-bad':'chip'}">${rel(c.next)}</span>`:'<span class="faint">planlanmayıb</span>'}</td><td><span class="pill ${CCLS[c.status]}">${c.status}</span></td></tr>`}).join('')}</tbody></table></div>
  <div class="pager"><span>${list.length} müştəri · səhifə ${S.cpage} / ${pages}</span><div class="row"><button class="btn sm" data-act="cpage" data-v="-1" ${S.cpage<=1?'disabled':''}>${ic('chevron-left')}Əvvəlki</button><button class="btn sm" data-act="cpage" data-v="1" ${S.cpage>=pages?'disabled':''}>Növbəti${ic('chevron-right')}</button></div></div>`
  :empty('search-x','Müştəri tapılmadı','Telefonu boşluqsuz yazmağı və ya filtrləri sıfırlamağı yoxlayın.');icons()}

V.musteri=()=>{const c=C(S.param);if(!c)return empty('circle-help','Müştəri tapılmadı','');
  const rq=REQS.filter(r=>r.cid===c.id),own=PROPS.filter(p=>p.owner===c.id),off=OFFERS.filter(o=>o.cid===c.id),it=INTER.filter(i=>i.cid===c.id),tk=TASKS.filter(t=>t.cid===c.id);
  const hist=[{d:c.created,t:'Profil yaradıldı',u:c.agent,x:`Mənbə: ${c.src}`},...rq.map(r=>({d:r.created,t:'Tələb əlavə edildi',u:c.agent,x:reqSummary(r)})),...(c.cats.length>1?[{d:day(dd(c.created)+ri(1,20),12),t:'Kateqoriya əlavə edildi',u:c.agent,x:CATL[c.cats[1]]}]:[])].sort((a,b)=>b.d-a.d);
  const tabs=[['reqs','Tələblər',rq.length],['own','Əmlakları',own.length],['offers','Təklif edilənlər',off.length],['inter','Əlaqələr',it.length],['tasks','Tapşırıqlar',tk.length],['notes','Qeydlər'],['hist','Dəyişiklik tarixçəsi']];

      <div class="row"><button class="btn sm" data-act="mreq" data-id="${r.id}">${ic('git-compare-arrows')}${m.length} uyğun əmlak</button>${L('Redaktə','Tələbin redaktəsi tam versiyada aktiv olacaq.','sm')}</div></div>
      <dl class="dl" style="margin:0 -16px -14px">${[['Əmlak növü',r.type],['Ərazi',r.districts.join(', ')],['Büdcə',`${azn(r.bmin)} – ${azn(r.bmax)}${r.deal==='Kirayə'?' /ay':''}`],['Otaq',r.rooms.join(' və ya ')],['Sahə',`${r.amin} – ${r.amax} m²`],['Mərtəbə',r.floor||'Fərq etməz'],['Təmir',r.repair||'Fərq etməz'],['Qeyd',r.note||'–']].map(([a,b])=>`<div><dt>${a}</dt><dd>${esc(b)}</dd></div>`).join('')}</dl></div>`}).join('')
    :empty('search','Axtarış tələbi yoxdur',c.cats.includes('Satıcı')||c.cats.includes('Ev sahibi')?'Bu müştəri satıcı və ya ev sahibidir. Əmlakları "Əmlakları" bölməsindədir.':'');
  if(S.ctab==='own')tab=own.length?`<div class="tw"><table class="t"><tbody>${own.map(p=>`<tr class="click" data-go="emlak" data-id="${p.id}"><td><div class="cell2">${thumb(p)}<div><b>${esc(p.title)}</b><small class="mono">${p.code}</small></div></div></td><td>${p.deal}</td><td class="r num">${priceTxt(p)}</td><td>${pill(p.status)}</td></tr>`).join('')}</tbody></table></div>`:empty('home','Bu müştərinin satdığı və ya kirayəyə verdiyi əmlak yoxdur','');
  if(S.ctab==='offers')tab=off.length?offerTable(off,'p'):empty('send','Hələ təklif edilmiş əmlak yoxdur','');
  if(S.ctab==='inter')tab=`<div class="panel-b" style="border-bottom:1px solid var(--line-2)">${L('Əlaqə qeyd et','Əlaqənin qeydə alınması tam versiyada aktiv olacaq: növ, tarix, nəticə və növbəti addım.','sm','plus')}</div><div class="tl">${it.map(i=>`<div class="tl-i"><div class="ico-b acc">${ic(IICON[i.type])}</div><div class="tt"><b>${i.type}</b>${i.pid?` · <a data-go="emlak" data-id="${i.pid}" style="cursor:pointer" class="mono">${P(i.pid).code}</a>`:''}<small>${fDT(i.d)} · ${short(i.agent)}</small><div style="margin-top:3px">${esc(i.res)}</div>${i.next!=='–'?`<small>Növbəti addım: ${esc(i.next)}</small>`:''}</div></div>`).join('')}</div>`;
  if(S.ctab==='tasks')tab=tk.length?taskRows(tk):empty('list-checks','Bu müştəri üzrə tapşırıq yoxdur','');
  if(S.ctab==='notes')tab=`<div class="panel-b stack"><div class="note"><div class="muted" style="font-size:12px;margin-bottom:4px">${short(c.agent)} · ${fD(c.created)}</div>${esc(c.notes)}</div><textarea class="inp" rows="3" placeholder="Daxili qeyd" id="cnote"></textarea><div>${L('Qeyd əlavə et','Qeydlərin saxlanması tam versiyada aktiv olacaq.','sm')}</div></div>`;
  if(S.ctab==='hist')tab=`<div class="tl">${hist.map(h=>`<div class="tl-i"><div class="ico-b">${ic('history')}</div><div class="tt">${h.t}<small>${fDT(h.d)} · ${short(h.u)} · ${esc(h.x)}</small></div></div>`).join('')}</div>`;
  return `<div class="crumb"><a data-go="musteriler">Müştərilər</a>${ic('chevron-right')}<span class="mono">${c.code}</span></div>`+
   ph(esc(c.name),`<span class="row">${c.cats.map(x=>`<span class="chip acc">${CATL[x]}</span>`).join('')}<span class="pill ${CCLS[c.status]}">${c.status}</span></span>`,
    `${L('Redaktə et','Profilin redaktəsi tam versiyada aktiv olacaq.','', 'pencil')}${L('Kateqoriya əlavə et','Kateqoriya əlavə etmək tam versiyada aktiv olacaq. Yeni profil yaranmır, mövcud profilə ehtiyac əlavə olunur.','', 'tag')}${L('Tapşırıq yarat','Tapşırıq yaratmaq tam versiyada aktiv olacaq.','', 'calendar-plus')}`)+
   `<div class="grid g-main"><section class="panel" style="min-width:0"><div class="tabs">${tabs.map(([k,l,n])=>`<button class="${S.ctab===k?'on':''}" data-act="ctab" data-v="${k}">${l}${n!=null?`<span class="c">${n}</span>`:''}</button>`).join('')}</div>${tab}</section>
   <div class="stack">${panel('Əsas məlumatlar',`<dl class="dl" style="grid-template-columns:1fr">${[['Telefon',c.phone],['E-poçt',c.email||'–'],['Mənbə',c.src],['Məsul əməkdaş',U(c.agent).name],['Son əlaqə',fDT(c.last)],['Növbəti əlaqə',c.next?fDT(c.next):'Planlanmayıb'],['Profil yaradılıb',fD(c.created)]].map(([a,b])=>`<div><dt>${a}</dt><dd class="${a==='Telefon'?'num':''}">${esc(b)}</dd></div>`).join('')}</dl>`)}

function taskRows(list){return list.map(t=>{const late=t.st!=='Tamamlanıb'&&dd(t.due)<0;return `<div class="li"><div class="ico-b ${t.st==='Tamamlanıb'?'ok':late?'bad':'acc'}">${ic(t.st==='Tamamlanıb'?'check':late?'alarm-clock':'circle-dashed')}</div>

function toast(t,s,icon='lock'){const el=document.createElement('div');el.className='toast';el.innerHTML=`${ic(icon)}<div><b>${esc(t)}</b><span>${esc(s)}</span></div>`;$('#toast').appendChild(el);icons();setTimeout(()=>el.remove(),4200);while($('#toast').children.length>2)$('#toast').firstChild.remove()}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-lock],[data-go],[data-act],[data-form]');
  if(!e.target.closest('#gq,#gres'))$('#gres').hidden=true;
  if(!e.target.closest('#bellBtn,#bellPop'))$('#bellPop').hidden=true;
  if(!e.target.closest('#qaBtn,#qaPop'))$('#qaPop').hidden=true;
  if(!t)return;
  if(t.dataset.lock!=null){e.preventDefault();toast('Tam versiyada aktiv olacaq',t.dataset.lock);return}
  if(t.dataset.form){if(t.dataset.form==='prop')propForm();else custForm();return}
  const a=t.dataset.act;
  if(a==='mclose'&&(e.target===t||t.tagName==='BUTTON')){$('#modal').innerHTML='';if(!t.dataset.go)return}
  if(a==='mclose'&&!t.dataset.go)return;
  if(t.dataset.go){if(a==='mprop'){S.mmode='p2c';S.mprop=+t.dataset.id;go('uygunlasdirma');return}go(t.dataset.go,t.dataset.id);return}
  const v=t.dataset.v;
  if(a==='ppage'){S.ppage+=+v;renderPropRes()}
  else if(a==='cpage'){S.cpage+=+v;renderCustRes()}
  else if(a==='resetPf'){Object.keys(S.pf).forEach(k=>S.pf[k]='');S.ppage=1;render()}
  else if(a==='resetCf'){Object.keys(S.cf).forEach(k=>S.cf[k]='');S.cpage=1;render()}
  else if(a==='ptab'){S.ptab=v;render()}
  else if(a==='ctab'){S.ctab=v;render()}
  else if(a==='proj'){S.proj=v;S.bld=PROJECTS.find(p=>p.id===v).b[0].id;S.apt=null;render()}
  else if(a==='bld'){S.bld=v;S.apt=null;render()}
  else if(a==='apt'){S.apt=v||null;render()}
  else if(a==='mmode'){S.mmode=v;render()}
  else if(a==='mreq'){S.mmode='c2p';S.mreq=+t.dataset.id;go('uygunlasdirma')}
  else if(a==='wreset'){S.w={...W0};render()}
  else if(a==='tst'){S.tf.st=v;render()}
  else if(a==='role'){S.role=v;render()}
});
function onField(e){const el=e.target;
  if(el.id==='gq'){gsearch(el.value);return}
  if(el.id==='nf_type'){syncPropForm();return}
  if(el.id==='nc_p'){dupCheck(el.value);return}
  if(el.dataset.w){S.w[el.dataset.w]=+el.value;const sum=Object.values(S.w).reduce((a,b)=>a+b,0)||1;Object.keys(S.w).forEach(k=>{const o=$('#wv_'+k);if(o)o.textContent=Math.round(S.w[k]/sum*100)+'%'});renderMatchRes();return}
  const f=el.dataset.f;if(!f)return;
  if(f==='showBad'){S.showBad=el.checked;renderMatchRes();return}
  if(f==='mreq'||f==='mprop'){S[f]=+el.value;renderMatchRes();return}
  const [scope,key]=f.split('.');
  if(scope==='tf'){S.tf.who=el.value||'all';render();return}
  S[scope][key]=el.value;
  if(scope==='pf'){S.ppage=1;renderPropRes()}else if(scope==='cf'){S.cpage=1;renderCustRes()}else if(scope==='rf')renderReports();else if(scope==='af')render();
}
document.addEventListener('input',e=>{if(e.target.tagName!=='SELECT')onField(e)});
document.addEventListener('change',e=>{if(e.target.tagName==='SELECT'||e.target.type==='checkbox')onField(e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#modal').innerHTML='';$('#gres').hidden=true}
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#gq').focus()}});
function gsearch(q){const box=$('#gres');q=q.trim().toLowerCase();if(q.length<2){box.hidden=true;return}const qd=q.replace(/\s/g,'');
  const ps=PROPS.filter(p=>(p.code+' '+p.title+' '+p.addr).toLowerCase().includes(q)).slice(0,5);
  const cs=CUST.filter(c=>c.name.toLowerCase().includes(q)||c.phone.replace(/\s/g,'').includes(qd)||c.code.toLowerCase().includes(q)).slice(0,5);
  box.innerHTML=(ps.length?`<div class="gh">Əmlaklar</div>`+ps.map(p=>`<div class="gi" data-go="emlak" data-id="${p.id}">${thumb(p)}<div class="main-t" style="font-size:13px">${esc(p.title)}<small class="muted mono" style="display:block">${p.code}</small></div></div>`).join(''):'')+
    (cs.length?`<div class="gh">Müştərilər</div>`+cs.map(c=>`<div class="gi" data-go="musteri" data-id="${c.id}"><span class="av">${initials(c.name)}</span><div style="font-size:13px">${esc(c.name)}<small class="muted num" style="display:block">${c.phone}</small></div></div>`).join(''):'')||'<div class="empty">Heç nə tapılmadı</div>';
  box.hidden=false;icons()}
$('#menuBtn').onclick=()=>{$('#sb').classList.add('open');$('#scrim').classList.add('open')};
$('#scrim').onclick=()=>{$('#sb').classList.remove('open');$('#scrim').classList.remove('open')};
$('#bellBtn').onclick=()=>{const p=$('#bellPop');p.hidden=!p.hidden;if(p.hidden)return;const od=overdue();
  p.innerHTML=`<div class="gh" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:4px 8px;font-weight:600">Bildirişlər</div>
   <div class="pi" data-go="tapsiriqlar"><span class="ico-b bad">${ic('alarm-clock')}</span><div>${od.length} tapşırığın vaxtı keçib<div class="muted" style="font-size:12px">Tapşırıqlar və əlaqələr</div></div></div>
   <div class="pi" data-go="inteqrasiyalar"><span class="ico-b warn">${ic('eye')}</span><div>${CHECKQ.length} mənzil API-də görünmür, yoxlama lazımdır<div class="muted" style="font-size:12px">İnteqrasiyalar · TEST</div></div></div>
   <div class="pi" data-go="uygunlasdirma"><span class="ico-b info">${ic('sparkles')}</span><div>${OFFERS.filter(o=>o.status==='Yeni uyğunluq').length} yeni uyğunluq nəzərdən keçirilməyib<div class="muted" style="font-size:12px">Uyğunlaşdırma</div></div></div>
   <div class="pi" data-go="sovdelesmeler"><span class="ico-b acc">${ic('stamp')}</span><div>${DEALS.filter(d=>d.stage==='Təsdiq gözləyir').length} sövdələşmə təsdiq gözləyir<div class="muted" style="font-size:12px">Satış və sövdələşmələr</div></div></div>`;icons()};
$('#qaBtn').onclick=()=>{const p=$('#qaPop');p.hidden=!p.hidden;p.innerHTML=`<div class="pi" data-form="prop">${ic('building-2')}Yeni əmlak</div><div class="pi" data-form="cust">${ic('user-plus')}Yeni müştəri</div><div class="pi" data-lock="Tapşırıq yaratmaq tam versiyada aktiv olacaq.">${ic('calendar-plus')}Tapşırıq</div><div class="pi" data-lock="Əlaqə qeydi tam versiyada aktiv olacaq.">${ic('phone')}Əlaqə qeydi</div><div class="pi" data-lock="Sövdələşmə yaratmaq tam versiyada aktiv olacaq.">${ic('handshake')}Sövdələşmə</div>`;icons()};

(function init(){const h=(location.hash||'').slice(1);if(V[h]&&h!=='emlak'&&h!=='musteri')S.route=h;render();
  if(!window.lucide){const s=document.querySelector('script[src*="lucide"]');s&&s.addEventListener('load',icons)}})();
</script>
</body>
</html>
